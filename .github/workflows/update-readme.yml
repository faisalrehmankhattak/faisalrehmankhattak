name: Update recent writing

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh recent writing from Medium
        run: python scripts/update_writing.py
      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No changes"
          else
            git config user.name "readme-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Update recent writing"
            git push
          fi
